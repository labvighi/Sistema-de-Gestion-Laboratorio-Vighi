<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Susana Vighi - Sistema de Gestión Integral</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="shortcut icon" type="image/png" href="favicon.png">
	<link rel="stylesheet" href="CSS/bootstrap.css" type="text/css">
	<link rel="stylesheet" href="CSS/animate.min.css" type="text/css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	<link rel="stylesheet" href="CSS/style.css?v=5" type="text/css">
	<link href="https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300|Open+Sans:400,600,700&amp;display=swap" rel="stylesheet">
	<script src="https://code.jquery.com/jquery-2.1.0.min.js" crossorigin="anonymous"></script>
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js" integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa" crossorigin="anonymous"></script>
</head>

<script>
	$(document).ready(function () {
		$("#navbar").load("navbar.html");
		$("#side-navbar").load("side-navbar.html");
		$("#footer").load("footer.html");
	});
</script>

<body>

<div><nav class="navbar navbar-default navbar-fixed-top navbar-login">
  <img src="IMG/logo.png" alt="Logo Sistema de Gestión" class="navbar-img">
  <p class="text-center navbar-login-text">Susana Vighi - Sistema de Gestión Integral</p>
</nav></div>

<div class="container">
    <div class="col-sm-8 ibox-login ibox-shadow">
      <div class="ibox-title text-center"><h2>INICIO DE SESIÓN</h2></div>

      <div class="ibox-content-form">
        <p class="text-center">Complete sus datos para ingresar.</p>

        <div class="form-group mt-2">
          <label>E-mail</label>
          <input id="email" type="email" class="form-control" placeholder="E-mail..." autocomplete="email">
        </div>
        <div class="form-group mt-2">
          <label>Contraseña</label>
          <input id="password" type="password" class="form-control" placeholder="Contraseña..." autocomplete="current-password">
        </div>

        <div id="status" ></div>

        <button id="btnLogin" class="btn btn-primary w-100 bg-btn" type="button">
          CONTINUAR
        </button>
      </div>
    </div>
  </div>

  <script src="JS/login.js"></script>

</body>
</html>
