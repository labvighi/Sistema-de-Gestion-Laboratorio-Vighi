<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios — Susana Vighi</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link rel="shortcut icon" type="image/png" href="IMG/favicon.png">
  <link rel="stylesheet" href="CSS/bootstrap-minimal.css" type="text/css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="CSS/style.css?v=10" type="text/css">
  <link rel="stylesheet" href="CSS/vighi-design-system.css" type="text/css">
  <link rel="stylesheet" href="CSS/pages/usuarios.css" type="text/css">
  <script src="https://code.jquery.com/jquery-2.1.0.min.js" crossorigin="anonymous"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js" crossorigin="anonymous"></script>
</head>

<script>
  $(document).ready(function () {
    $("#navbar").load("navbar.html?v=3");
    $("#side-navbar").load("side-navbar.html?v=7");
    $("#footer").load("footer.html?v=2");
  });
</script>

<body>
  <div id="navbar"></div>
  <div id="side-navbar"></div>

  <div class="wrapper">
  <div class="usr-page">

    <!-- Header -->
    <div class="usr-header">
      <div>
        <div class="usr-eyebrow">Sistema</div>
        <h1 class="usr-title"><i class="fas fa-user-shield"></i> Usuarios</h1>
      </div>
      <a href="crearUsuario.html" class="usr-nuevo-btn">
        <i class="fa fa-plus"></i> Nuevo usuario
      </a>
    </div>

    <!-- Card -->
    <div class="usr-card">

      <!-- Filtros -->
      <div class="usr-filters">
        <span class="usr-filter-label">Filtrar</span>
        <select id="filtroTipo" class="usr-select">
          <option value="">Tipo: todos</option>
          <option value="1">Administración</option>
          <option value="2">Citotécnico</option>
          <option value="3">Dirección</option>
          <option value="4">Externo</option>
          <option value="5">Gerencial</option>
          <option value="6">Patólogo</option>
          <option value="7">Técnico</option>
        </select>
        <input type="text" id="filtroBuscar" class="usr-input" placeholder="Nombre, apellido o e-mail..." autocomplete="off">
      </div>

      <!-- Contador -->
      <div class="usr-table-bar">
        <span id="usuarios-contador"></span>
      </div>

      <!-- Tabla -->
      <table class="usuarios-tabla" id="tablaUsuarios">
        <thead>
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>E-mail</th>
            <th>Perfil</th>
            <th style="text-align:center; width:60px;">Acción</th>
          </tr>
        </thead>
        <tbody id="tbodyUsuarios">
          <tr>
            <td colspan="6" class="usuarios-cargando">
              <i class="fas fa-spinner fa-spin"></i> Cargando usuarios...
            </td>
          </tr>
        </tbody>
      </table>

    </div><!-- /card -->
  </div>
  </div>

  <div id="footer"></div>
  <script src="JS/usuarios.js"></script>
</body>
</html>
