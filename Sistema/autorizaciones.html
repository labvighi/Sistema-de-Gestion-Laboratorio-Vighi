<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autorizaciones �?? Susana Vighi</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link rel="shortcut icon" type="image/png" href="IMG/favicon.png">
  <link rel="stylesheet" href="CSS/bootstrap-minimal.css" type="text/css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="CSS/style.css?v=10" type="text/css">
  <link rel="stylesheet" href="CSS/vighi-design-system.css" type="text/css">
  <link rel="stylesheet" href="CSS/pages/autorizaciones.css" type="text/css">
  <script src="https://code.jquery.com/jquery-2.1.0.min.js" crossorigin="anonymous"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js" crossorigin="anonymous"></script>
</head>

<script>
  $(document).ready(function () {
    $("#navbar").load("navbar.html?v=3");
    $("#side-navbar").load("side-navbar.html?v=7");
    $("#footer").load("footer.html?v=2");
  });
</script>

<body>
  <div id="navbar"></div>
  <div id="side-navbar"></div>

  <div class="wrapper">
  <div class="aut-page">

    <!-- Breadcrumb -->
    <div class="aut-breadcrumb">
      <a href="admin.html" class="aut-bread-link">Administración</a>
      <span class="aut-bread-sep"><i class="fas fa-chevron-right"></i></span>
      <span class="aut-bread-current">Autorizaciones</span>
    </div>

    <!-- Header -->
    <div class="aut-header">
      <div class="aut-eyebrow">Administración</div>
      <h1 class="aut-title"><i class="fas fa-wifi"></i> Autorizaciones</h1>
    </div>

    <!-- Card -->
    <div class="aut-card">

      <!-- Filtros fila 1: tiempo -->
      <div class="aut-filtros aut-filtros-top">
        <select class="aut-select aut-select-sm" id="autAnio"></select>
        <select class="aut-select" id="autMes"></select>
        <select class="aut-select" id="autDia">
          <option value="">[ Día: todos ]</option>
          <!-- poblar por JS -->
        </select>
      </div>

      <!-- Filtros fila 2: datos -->
      <div class="aut-filtros aut-filtros-bot">
        <select class="aut-select aut-select-lg" id="autCobertura">
          <option value="">[ Cobertura: todas ]</option>
          <!-- BDD: poblar dinámicamente -->
        </select>
        <select class="aut-select aut-select-md" id="autElegibilidad">
          <option value="">[ Elegibilidad: todos ]</option>
          <option value="aprobada">Aprobada</option>
          <option value="no_aprobada">No aprobada</option>
        </select>
        <select class="aut-select aut-select-md" id="autAutorizaciones">
          <option value="">[ Autorizaciones: todas ]</option>
          <option value="pendientes">Pendientes</option>
          <option value="completas">Completas</option>
        </select>
        <select class="aut-select aut-select-md" id="autFacturado">
          <option value="">[ Facturado: todas ]</option>
          <option value="si">Facturado: Sí</option>
          <option value="no">Facturado: No</option>
        </select>
      </div>

      <!-- Tabla -->
      <div class="aut-tabla-wrap">
        <table class="aut-tabla">
          <thead>
            <tr>
              <th>Protocolo</th>
              <th>Estado</th>
              <th>Fecha</th>
              <th>Elegibilidad</th>
              <th>Estudios</th>
              <th>Resultado</th>
            </tr>
          </thead>
          <tbody id="autTbody"></tbody>
        </table>
      </div>

      <!-- Contador -->
      <div class="aut-footer" id="autFooter"></div>

    </div>
  </div>
  </div>

  <div id="footer"></div>
  <script src="JS/autorizaciones.js"></script>
</body>
</html>
