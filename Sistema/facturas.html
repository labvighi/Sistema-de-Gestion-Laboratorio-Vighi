<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facturación �?? Susana Vighi</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link rel="shortcut icon" type="image/png" href="IMG/favicon.png">
  <link rel="stylesheet" href="CSS/bootstrap-minimal.css" type="text/css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="CSS/style.css?v=10" type="text/css">
  <link rel="stylesheet" href="CSS/vighi-design-system.css" type="text/css">
  <link rel="stylesheet" href="CSS/pages/facturas.css" type="text/css">
  <script src="https://code.jquery.com/jquery-2.1.0.min.js" crossorigin="anonymous"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js" crossorigin="anonymous"></script>
</head>

<script>
  $(document).ready(function () {
    $("#navbar").load("navbar.html?v=3");
    $("#side-navbar").load("side-navbar.html?v=7");
    $("#footer").load("footer.html?v=2");
  });
</script>

<body>
  <div id="navbar"></div>
  <div id="side-navbar"></div>

  <div class="wrapper">
  <div class="fct-page">

    <!-- Breadcrumb -->
    <div class="fct-breadcrumb">
      <a href="admin.html" class="fct-bread-link">Administración</a>
      <span class="fct-bread-sep"><i class="fas fa-chevron-right"></i></span>
      <span class="fct-bread-current">Facturación</span>
    </div>

    <!-- Header -->
    <div class="fct-header">
      <div class="fct-eyebrow">Administración</div>
      <h1 class="fct-title"><i class="fas fa-file-invoice"></i> Facturación</h1>
    </div>

    <!-- Card principal -->
    <div class="fct-card">

      <!-- Filtros -->
      <div class="fct-filtros">
        <select class="fct-select fct-select-lg" id="fctCobertura">
          <option value="">[ Cobertura ]</option>
          <!-- BDD: poblar dinámicamente -->
        </select>
        <select class="fct-select fct-select-sm" id="fctAnio">
          <!-- poblar por JS -->
        </select>
        <select class="fct-select" id="fctMes">
          <!-- poblar por JS -->
        </select>
        <select class="fct-select fct-select-md" id="fctEstado">
          <option value="">[ Estado: todas ]</option>
          <option value="borrador">Borrador</option>
          <option value="emitida">Emitida</option>
          <option value="cobrada">Cobrada</option>
          <option value="sincobrar">[ Estado: sin cobrar ]</option>
        </select>
        <select class="fct-select fct-select-md" id="fctRefact">
          <option value="">[ Refacturación: todo ]</option>
          <option value="solo_refact">[ Solo refacturación ]</option>
          <option value="solo_fact">[ Solo facturación ]</option>
        </select>
      </div>

      <!-- Tabla -->
      <div class="fct-tabla-wrap">
        <table class="fct-tabla">
          <thead>
            <tr>
              <th>Nro. Factura</th>
              <th>Estado</th>
              <th>FF</th>
              <th>FEC <i class="fas fa-question-circle fct-th-hint" title="Fecha Estimada de Cobro"></i></th>
              <th>Cobertura</th>
              <th class="fct-num">Exento</th>
              <th class="fct-num">Gravado</th>
              <th class="fct-num">IVA</th>
              <th class="fct-num">Total</th>
            </tr>
          </thead>
          <tbody id="fctTbody">
          </tbody>
        </table>
      </div>

      <!-- Footer de la tabla: totales -->
      <div class="fct-totales" id="fctTotales"></div>

    </div>

  </div>
  </div>

  <div id="footer"></div>
  <script src="JS/facturas.js"></script>
</body>
</html>
