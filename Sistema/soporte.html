<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soporte — Susana Vighi</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link rel="shortcut icon" type="image/png" href="IMG/favicon.png">
  <link rel="stylesheet" href="CSS/bootstrap-minimal.css" type="text/css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="CSS/style.css?v=10" type="text/css">
  <link rel="stylesheet" href="CSS/vighi-design-system.css" type="text/css">
  <script src="https://code.jquery.com/jquery-2.1.0.min.js" crossorigin="anonymous"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="CSS/pages/soporte.css" type="text/css">
</head>

<script>
  $(document).ready(function () {
    $("#navbar").load("navbar.html?v=3");
    $("#side-navbar").load("side-navbar.html?v=7");
    $("#footer").load("footer.html?v=2");
  });
</script>

<body>
  <div id="navbar"></div>
  <div id="side-navbar"></div>

  <div class="wrapper">
  <div class="sp-page">

    <!-- Header -->
    <div class="sp-header">
      <div>
        <div class="sp-eyebrow">Sistema</div>
        <h1 class="sp-title"><i class="fas fa-life-ring"></i> Soporte</h1>
      </div>
      <a href="nuevoTicket.html" class="btn-soporte-nuevo">
        <i class="fas fa-plus"></i> Nuevo ticket
      </a>
    </div>

    <!-- Card dashboard -->
    <div class="sp-card">
      <div class="sp-card-header">
        <span class="sp-card-label">Dashboard</span>
        <span class="sp-card-sub">Tickets en curso</span>
      </div>
      <div class="soporte-dashboard">
        <table class="soporte-dash-tabla">
          <thead>
            <tr>
              <th>Tipo</th>
              <th>On Time</th><th>Delayed</th><th>Late</th>
              <th>Late 5d</th><th>Late 5-10d</th><th>Late +10d</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody><tr id="dashRowEvolutivo"></tr></tbody>
        </table>
        <table class="soporte-dash-tabla soporte-dash-tabla-2">
          <thead>
            <tr>
              <th>Tipo</th>
              <th>On Time</th><th>Delayed</th><th>Late</th>
              <th>Late 5d</th><th>Late 5-10d</th><th>Late +10d</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody><tr id="dashRowResolutivo"></tr></tbody>
        </table>
      </div>
    </div>

    <!-- Card tickets -->
    <div class="sp-card">

      <!-- Filtros -->
      <div class="soporte-filtros-fila">
        <select class="form-control estudios-sel estudios-sel-md" id="spTipo">
          <option>[ Tipos: todos ]</option>
          <option>Evolutivo</option>
          <option>Resolutivo</option>
        </select>
        <select class="form-control estudios-sel estudios-sel-sm" id="spEstado">
          <option>[ Abiertos ]</option>
          <option>Cerrados</option>
          <option>Todos</option>
        </select>
        <select class="form-control estudios-sel estudios-sel-lg" id="spAsignado">
          <option>BACA, Tiago</option>
        </select>
        <select class="form-control estudios-sel estudios-sel-md" id="spAtraso">
          <option>[ Atraso: todos ]</option>
          <option>On Time</option>
          <option>Delayed</option>
          <option>Late</option>
        </select>
      </div>

      <!-- Tabla -->
      <table class="soporte-tabla">
        <thead>
          <tr>
            <th class="soporte-th-num"># Ticket</th>
            <th>Asunto</th>
            <th class="soporte-th-fecha">Deadline</th>
            <th class="soporte-th-tipo">Tipo</th>
            <th class="soporte-th-estado">Estado</th>
            <th class="soporte-th-sched">Schedule</th>
          </tr>
        </thead>
        <tbody id="tbodySoporte">
          <tr>
            <td colspan="6" class="estudios-vacio">
              <i class="fas fa-life-ring estudios-vacio-icono"></i>
              <p>No hay tickets cargados.</p>
            </td>
          </tr>
        </tbody>
      </table>

    </div><!-- /card tickets -->

  </div>
  </div>

  <div id="footer"></div>
  <script src="JS/soporte.js"></script>
</body>
</html>
