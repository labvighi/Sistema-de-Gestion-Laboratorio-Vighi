<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Médicos — Susana Vighi</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link rel="shortcut icon" type="image/png" href="IMG/favicon.png">
  <link rel="stylesheet" href="CSS/bootstrap-minimal.css" type="text/css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="CSS/style.css?v=10" type="text/css">
  <link rel="stylesheet" href="CSS/vighi-design-system.css" type="text/css">
  <link rel="stylesheet" href="CSS/pages/medicos.css" type="text/css">
  <script src="https://code.jquery.com/jquery-2.1.0.min.js" crossorigin="anonymous"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js" crossorigin="anonymous"></script>
</head>

<script>
  $(document).ready(function () {
    $("#navbar").load("navbar.html?v=3");
    $("#side-navbar").load("side-navbar.html?v=7");
    $("#footer").load("footer.html?v=2");
  });
</script>

<body>
  <div id="navbar"></div>
  <div id="side-navbar"></div>

  <div class="wrapper">
  <div class="med-page">

    <!-- Header -->
    <div class="med-header">
      <div>
        <div class="med-eyebrow">Agenda</div>
        <h1 class="med-title"><i class="fas fa-user-md"></i> Médicos</h1>
      </div>
      <a href="nuevoMedico.html" class="med-nuevo-btn">
        <i class="fa fa-plus"></i> Nuevo médico
      </a>
    </div>

    <!-- Card -->
    <div class="med-card">

      <!-- Filtro alfabético -->
      <div class="med-alpha-bar" id="filtroAlfabeto">
        <button class="btn-medicos-letra active" data-letra="">Todos</button>
        <button class="btn-medicos-letra" data-letra="A">A</button>
        <button class="btn-medicos-letra" data-letra="B">B</button>
        <button class="btn-medicos-letra" data-letra="C">C</button>
        <button class="btn-medicos-letra" data-letra="D">D</button>
        <button class="btn-medicos-letra" data-letra="E">E</button>
        <button class="btn-medicos-letra" data-letra="F">F</button>
        <button class="btn-medicos-letra" data-letra="G">G</button>
        <button class="btn-medicos-letra" data-letra="H">H</button>
        <button class="btn-medicos-letra" data-letra="I">I</button>
        <button class="btn-medicos-letra" data-letra="J">J</button>
        <button class="btn-medicos-letra" data-letra="K">K</button>
        <button class="btn-medicos-letra" data-letra="L">L</button>
        <button class="btn-medicos-letra" data-letra="M">M</button>
        <button class="btn-medicos-letra" data-letra="N">N</button>
        <button class="btn-medicos-letra" data-letra="O">O</button>
        <button class="btn-medicos-letra" data-letra="P">P</button>
        <button class="btn-medicos-letra" data-letra="Q">Q</button>
        <button class="btn-medicos-letra" data-letra="R">R</button>
        <button class="btn-medicos-letra" data-letra="S">S</button>
        <button class="btn-medicos-letra" data-letra="T">T</button>
        <button class="btn-medicos-letra" data-letra="U">U</button>
        <button class="btn-medicos-letra" data-letra="V">V</button>
        <button class="btn-medicos-letra" data-letra="W">W</button>
        <button class="btn-medicos-letra" data-letra="X">X</button>
        <button class="btn-medicos-letra" data-letra="Y">Y</button>
        <button class="btn-medicos-letra" data-letra="Z">Z</button>
      </div>

      <!-- Header tabla -->
      <div class="med-table-header">
        <span id="medicos-contador"></span>
      </div>

      <!-- Tabla -->
      <table class="usuarios-tabla" id="tablaMedicos">
        <thead>
          <tr>
            <th>Médico</th>
            <th>MN</th>
            <th>MP</th>
            <th style="text-align:center; width:60px;">Acción</th>
          </tr>
        </thead>
        <tbody id="tbodyMedicos">
          <tr>
            <td colspan="4" class="usuarios-cargando text-center">
              <i class="fas fa-spinner fa-spin"></i> Cargando...
            </td>
          </tr>
        </tbody>
      </table>

    </div><!-- /card -->
  </div>
  </div>

  <div id="footer"></div>
  <script src="JS/historial-utils.js"></script>
  <script src="JS/medicos.js"></script>
</body>
</html>
