<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Susana Vighi - Sistema de Gestión Integral</title>
    <link rel="shortcut icon" href="IMG/favicon.png">
    <link rel="stylesheet" href="CSS/bootstrap.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="CSS/animate.min.css">
    <link rel="stylesheet" href="CSS/inspinia.css">
    <link rel="stylesheet" href="CSS/navbar.css">
    <link rel="stylesheet" href="CSS/style_mobile.css">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-2.1.1.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</head>
<body class="pace-done">

    <div id="navbar"></div>

    <div id="wrapper">
        <div id="side-navbar"></div>

        <div id="page-wrapper">
            <div class="wrapper wrapper-content">

                <div class="ibox">
                    <div class="ibox-title">
                        <h5>Dashboard</h5>
                    </div>
                    <div class="ibox-content">
                        <h2>¡Bienvenido al Sistema!</h2>
                        <div class="alert alert-light-outline">
                            <p><strong>Usuario:</strong> <span id="userEmail">Cargando...</span></p>
                        </div>
                        <p>Has iniciado sesión correctamente en el Sistema de Gestión Integral.</p>
                        <a href="crearUsuario.html" class="btn btn-primary btn-sm"><i class="fa fa-plus-circle"></i> Crear usuario</a>
                    </div>
                </div>

            </div>
            <div id="footer"></div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $("#navbar").load("navbar.html");
            $("#side-navbar").load("side-navbar.html");
            $("#footer").load("footer.html");
        });

        var usuario = sessionStorage.getItem("usuario");
        if (!usuario) {
            window.location.href = "index.html";
        } else {
            var userData = JSON.parse(usuario);
            document.addEventListener("DOMContentLoaded", function() {
                document.getElementById("userEmail").textContent = userData.mail;
            });
        }
    </script>
</body>
</html>
