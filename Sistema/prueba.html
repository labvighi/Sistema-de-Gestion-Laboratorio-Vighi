<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio - Susana Vighi</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link rel="shortcut icon" type="image/png" href="IMG/favicon.png">
  <link rel="stylesheet" href="CSS/bootstrap-minimal.css" type="text/css">
  <link rel="stylesheet" href="CSS/animate.min.css" type="text/css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="CSS/style.css?v=10" type="text/css">
  <link rel="stylesheet" href="CSS/vighi-design-system.css" type="text/css">
  <link rel="stylesheet" href="CSS/pages/prueba.css" type="text/css">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300|Open+Sans:400,600,700&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-2.1.0.min.js" crossorigin="anonymous"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js" integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa" crossorigin="anonymous"></script>
</head>

<script>
  $(document).ready(function () {
    $("#navbar").load("navbar.html?v=3");
    $("#side-navbar").load("side-navbar.html?v=7");
    $("#footer").load("footer.html?v=2");
  });
</script>

<body>
  <div id="navbar"></div>
  <div id="side-navbar"></div>

  <div class="wrapper">
    <div class="ibox ibox-shadow bienvenida-box">
      <div class="bienvenida-header">
        <div class="bienvenida-avatar"><img src="IMG/logo_sv_blanco.png" alt="Susana Vighi"></div>
        <div class="bienvenida-info">
          <h3 id="bienvenida-nombre">Cargando...</h3>
          <span class="bienvenida-perfil" id="bienvenida-perfil"><i class="far fa-address-card"></i> Perfil</span>
          <p class="bienvenida-mensaje">Sesi&oacute;n iniciada correctamente en el Sistema de Gesti&oacute;n Integral.</p>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script>
    var usuario = sessionStorage.getItem("usuario");
    if (!usuario) {
      usuario = localStorage.getItem("usuario");
      if (usuario) {
        sessionStorage.setItem("usuario", usuario);
      } else {
        window.location.href = "index.html";
      }
    }

    var userData = JSON.parse(usuario);
    var nombre = userData.mail ? userData.mail.split("@")[0].toUpperCase() : "USUARIO";
    document.getElementById("bienvenida-nombre").textContent = "Bienvenido, " + nombre + "!";
    document.getElementById("bienvenida-perfil").innerHTML = '<i class="far fa-address-card"></i> ' + (userData.perfilNombre || "Usuario");
  </script>
</body>
</html>
