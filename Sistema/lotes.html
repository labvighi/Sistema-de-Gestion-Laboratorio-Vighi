<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lotes — Susana Vighi</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link rel="shortcut icon" type="image/png" href="IMG/favicon.png">
  <link rel="stylesheet" href="CSS/bootstrap-minimal.css" type="text/css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="CSS/style.css?v=10" type="text/css">
  <link rel="stylesheet" href="CSS/vighi-design-system.css" type="text/css">
  <script src="https://code.jquery.com/jquery-2.1.0.min.js" crossorigin="anonymous"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="CSS/pages/lotes.css" type="text/css">
</head>

<script>
  $(document).ready(function () {
    $("#navbar").load("navbar.html?v=3");
    $("#side-navbar").load("side-navbar.html?v=7");
    $("#footer").load("footer.html?v=2");
  });
</script>

<body>
  <div id="navbar"></div>
  <div id="side-navbar"></div>

  <div class="wrapper">
  <div class="lot-page">

    <!-- Header -->
    <div class="lot-header">
      <div>
        <div class="lot-eyebrow">Laboratorio</div>
        <h1 class="lot-title"><i class="fas fa-layer-group"></i> Lotes</h1>
      </div>
      <button class="lot-nuevo-btn" id="btnCrearLote">
        <i class="fas fa-plus"></i> Crear un lote
      </button>
    </div>

    <!-- Card lotes activos -->
    <div class="lot-card">
      <div class="lot-card-header">
        <span class="lot-section-label">Lotes activos</span>
      </div>
      <table class="lotes-activos-tabla">
        <thead>
          <tr>
            <th>Tipo</th>
            <th>Lote activo</th>
            <th style="width:80px;"></th>
          </tr>
        </thead>
        <tbody id="tbodyLotesActivos">
          <tr>
            <td colspan="3" class="usuarios-vacio">Cargando...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Card histórico -->
    <div class="lot-card">

      <!-- Filtros -->
      <div class="lot-filters">
        <span class="lot-filter-label">Filtrar</span>
        <select class="form-control estudios-sel estudios-sel-sm" id="filtroTipoLote">
          <option>PAP</option>
          <option>CT</option>
          <option>BP</option>
          <option>IHQ</option>
        </select>
        <select class="form-control estudios-sel estudios-sel-md"><option>[ Lote: todos ]</option></select>
        <select class="form-control estudios-sel estudios-sel-md"><option>[ Estado: todos ]</option></select>
        <select class="form-control estudios-sel estudios-sel-xl"><option>[ Citotécnico: todos ]</option></select>
        <select class="form-control estudios-sel estudios-sel-anio" id="filtroAnioLote">
          <option>2024</option><option>2025</option><option selected>2026</option>
        </select>
        <select class="form-control estudios-sel estudios-sel-mes" id="filtroMesLote">
          <option value="">[ meses ]</option>
          <option>Enero</option><option>Febrero</option><option>Marzo</option>
          <option>Abril</option><option>Mayo</option><option>Junio</option>
          <option>Julio</option><option>Agosto</option><option>Septiembre</option>
          <option>Octubre</option><option>Noviembre</option><option>Diciembre</option>
        </select>
        <select class="form-control estudios-sel estudios-sel-dia" id="filtroDiaLote">
          <option value="">[ días ]</option>
          <option>1</option><option>2</option><option>3</option><option>4</option>
          <option>5</option><option>6</option><option>7</option><option>8</option>
          <option>9</option><option>10</option><option>11</option><option>12</option>
          <option>13</option><option>14</option><option>15</option><option>16</option>
          <option>17</option><option>18</option><option>19</option><option>20</option>
          <option>21</option><option>22</option><option>23</option><option>24</option>
          <option>25</option><option>26</option><option>27</option><option>28</option>
          <option>29</option><option>30</option><option>31</option>
        </select>
        <select class="form-control estudios-sel estudios-sel-lg"><option>[ Actividad: todas ]</option></select>
      </div>

      <!-- Contador -->
      <div class="lot-table-bar">
        <span id="lotes-contador"></span>
      </div>

      <!-- Tabla -->
      <table class="lotes-tabla" id="tablaLotes">
        <thead>
          <tr>
            <th>Lote</th>
            <th>Estado</th>
            <th>Actividad actual</th>
          </tr>
        </thead>
        <tbody id="tbodyLotes">
          <tr>
            <td colspan="3" class="usuarios-vacio">
              <i class="fas fa-layer-group" style="font-size:28px; color:rgba(124,62,237,0.2); display:block; margin-bottom:10px;"></i>
              No hay lotes cargados.
            </td>
          </tr>
        </tbody>
      </table>

    </div><!-- /card histórico -->

  </div>
  </div>

  <div id="footer"></div>
  <script src="JS/lotes.js"></script>
</body>
</html>
