<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboards - Susana Vighi</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link rel="shortcut icon" type="image/png" href="IMG/favicon.png">
  <link rel="stylesheet" href="CSS/bootstrap.css" type="text/css">
  <link rel="stylesheet" href="CSS/animate.min.css" type="text/css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="CSS/style.css?v=5" type="text/css">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300|Open+Sans:400,600,700&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-2.1.0.min.js" crossorigin="anonymous"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js" integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa" crossorigin="anonymous"></script>
  <style>
    .dashboard-panel {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      margin: 15px;
    }

    .dashboard-tabs {
      display: flex;
      flex-wrap: wrap;
      border-bottom: 1px solid #ddd;
      padding: 0 10px;
    }

    .dashboard-tab {
      padding: 10px 14px;
      cursor: pointer;
      color: #555;
      font-size: 13px;
      border: 1px solid transparent;
      margin-bottom: -1px;
      text-decoration: none;
      display: block;
    }

    .dashboard-tab:hover {
      color: #333;
      background-color: #f5f5f5;
      text-decoration: none;
    }

    .dashboard-tab.active {
      background-color: #e8e8e8;
      border-color: #ddd;
      border-bottom-color: #e8e8e8;
      color: #333;
      font-weight: 600;
    }

    .dashboard-filters {
      padding: 8px 15px;
      border-bottom: 1px solid #eee;
    }

    .dashboard-filters select {
      border: 1px solid #ccc;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 13px;
      margin-right: 5px;
      background: white;
      color: #555;
      cursor: pointer;
    }

    .btn-actualizar {
      background-color: white;
      border: 1px solid #ccc;
      padding: 4px 10px;
      border-radius: 3px;
      font-size: 13px;
      cursor: pointer;
      color: #555;
    }

    .btn-actualizar:hover {
      background-color: #f5f5f5;
    }

    .dashboard-content {
      padding: 15px;
      min-height: 300px;
    }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* Tabla Validación */
    .overflow-x-auto { overflow-x: auto; }

    .table-validacion {
      font-size: 12px;
      width: 100%;
      border-collapse: collapse;
    }

    .table-validacion th,
    .table-validacion td {
      text-align: center;
      padding: 4px 6px;
      border: 1px solid #e8e8e8;
      white-space: nowrap;
    }

    .table-validacion th:first-child,
    .table-validacion td:first-child {
      text-align: left;
      padding-left: 10px;
      min-width: 160px;
    }

    .table-validacion thead th {
      font-weight: 600;
      color: #444;
      background-color: #fafafa;
    }

    .table-validacion thead th.weekend { color: #5b8dd9; }
    .table-validacion td.weekend { color: #5b8dd9; }

    .table-validacion tbody tr:hover { background-color: #f9f9f9; }

    .table-validacion tfoot tr {
      background-color: #f0f0f0;
      font-weight: 600;
    }

    .dashboard-title {
      padding: 15px 15px 5px 15px;
      margin: 0;
      font-size: 20px;
      color: #444;
      font-weight: 400;
    }
  </style>
</head>

<script>
  $(document).ready(function () {
    $("#navbar").load("navbar.html");
    $("#side-navbar").load("side-navbar.html");
    $("#footer").load("footer.html");
  });
</script>

<body>
  <div id="navbar"></div>
  <div id="side-navbar"></div>

  <div class="wrapper">
    <div>
      <h3 class="dashboard-title">
        <i class="fa fa-th-large"></i> Dashboards
      </h3>

      <div class="dashboard-panel">

        <!-- Navegación de pestañas -->
        <div class="dashboard-tabs">
          <a class="dashboard-tab active" data-tab="gerencial">Gerencial</a>
          <a class="dashboard-tab" data-tab="macro">Macro</a>
          <a class="dashboard-tab" data-tab="citotecnicos">Citotécnicos</a>
          <a class="dashboard-tab" data-tab="patologos">Patólogos</a>
          <a class="dashboard-tab" data-tab="tecnicos">Técnicos</a>
          <a class="dashboard-tab" data-tab="ejecutivo">Ejecutivo</a>
          <a class="dashboard-tab" data-tab="performance">Performance</a>
          <a class="dashboard-tab" data-tab="proyeccion">Proyección</a>
          <a class="dashboard-tab" data-tab="validacion">Validación</a>
        </div>

        <!-- GERENCIAL -->
        <div class="tab-pane active" id="tab-gerencial">
          <div class="dashboard-filters">
            <select id="flujos">
              <option value="">[ Flujos: todos ]</option>
              <option value="citologia">Citología</option>
              <option value="histologia">Histología</option>
            </select>
            <select id="cobertura">
              <option value="">[ Cobertura: todas ]</option>
              <option value="OSDE">OSDE</option>
              <option value="PAMI">PAMI</option>
              <option value="particular">Particular</option>
            </select>
            <select id="lote">
              <option value="">[ Lote: todos ]</option>
            </select>
            <select id="procedencia">
              <option value="">[ Procedencia: todas ]</option>
              <option value="santa-fe">Av. Santa Fe</option>
              <option value="monserrat">CM Monserrat</option>
              <option value="otamendi">CM Otamendi</option>
              <option value="medrano">Medrano</option>
            </select>
            <button class="btn-actualizar" onclick="actualizarGerencial()">
              <i class="fa fa-refresh"></i> Actualizar
            </button>
          </div>
          <div class="dashboard-content">
            <!-- contenido gerencial -->
          </div>
        </div>

        <!-- MACRO -->
        <div class="tab-pane" id="tab-macro">
          <div class="dashboard-content">
            <p class="text-muted text-center" style="padding-top:60px;">En construcción</p>
          </div>
        </div>

        <!-- CITOTÉCNICOS -->
        <div class="tab-pane" id="tab-citotecnicos">
          <div class="dashboard-content">
            <p class="text-muted text-center" style="padding-top:60px;">En construcción</p>
          </div>
        </div>

        <!-- PATÓLOGOS -->
        <div class="tab-pane" id="tab-patologos">
          <div class="dashboard-content">
            <p class="text-muted text-center" style="padding-top:60px;">En construcción</p>
          </div>
        </div>

        <!-- TÉCNICOS -->
        <div class="tab-pane" id="tab-tecnicos">
          <div class="dashboard-content">
            <p class="text-muted text-center" style="padding-top:60px;">En construcción</p>
          </div>
        </div>

        <!-- EJECUTIVO -->
        <div class="tab-pane" id="tab-ejecutivo">
          <div class="dashboard-content">
            <p class="text-muted text-center" style="padding-top:60px;">En construcción</p>
          </div>
        </div>

        <!-- PERFORMANCE -->
        <div class="tab-pane" id="tab-performance">
          <div class="dashboard-content">
            <p class="text-muted text-center" style="padding-top:60px;">En construcción</p>
          </div>
        </div>

        <!-- PROYECCIÓN -->
        <div class="tab-pane" id="tab-proyeccion">
          <div class="dashboard-content">
            <p class="text-muted text-center" style="padding-top:60px;">En construcción</p>
          </div>
        </div>

        <!-- VALIDACIÓN -->
        <div class="tab-pane" id="tab-validacion">
          <div class="dashboard-filters">
            <select id="val-anio" onchange="renderTablaValidacion()">
              <option value="2026">2026</option>
              <option value="2025">2025</option>
              <option value="2024">2024</option>
            </select>
            <select id="val-mes" onchange="renderTablaValidacion()">
              <option value="0">Enero</option>
              <option value="1">Febrero</option>
              <option value="2">Marzo</option>
              <option value="3">Abril</option>
              <option value="4" selected>Mayo</option>
              <option value="5">Junio</option>
              <option value="6">Julio</option>
              <option value="7">Agosto</option>
              <option value="8">Septiembre</option>
              <option value="9">Octubre</option>
              <option value="10">Noviembre</option>
              <option value="11">Diciembre</option>
            </select>
          </div>
          <div class="dashboard-content overflow-x-auto">
            <div id="tabla-validacion-container"></div>
          </div>
        </div>

      </div><!-- /.dashboard-panel -->
    </div>
  </div>

  <div id="footer"></div>

  <script>
    // Verificar sesión
    var usuario = sessionStorage.getItem("usuario");
    if (!usuario) {
      usuario = localStorage.getItem("usuario");
      if (usuario) {
        sessionStorage.setItem("usuario", usuario);
      } else {
        window.location.href = "index.html";
      }
    }

    // Cambio de pestañas
    document.querySelectorAll('.dashboard-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.dashboard-tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelectorAll('.tab-pane').forEach(function(p) { p.classList.remove('active'); });
        this.classList.add('active');
        document.getElementById('tab-' + this.getAttribute('data-tab')).classList.add('active');
        if (this.getAttribute('data-tab') === 'validacion') {
          renderTablaValidacion();
        }
      });
    });

    function actualizarGerencial() {
      // placeholder para integración futura
    }

    // Datos de muestra para Validación
    var datosValidacion = {
      'ACCATTATI, C':         { 4: 19 },
      'BAEZ, S':              { 4: 118, 5: 11 },
      'CANEPA, M':            { 5: 69 },
      'GONZALEZ, V':          { 5: 235 },
      'GREGORIO MILLICAY, L': { 5: 9, 6: 9 },
      'HUMEREZ, V':           { 5: 11 },
      'LOPEZ, T':             { 5: 3 }
    };

    function getDiasEnMes(anio, mes) {
      return new Date(anio, mes + 1, 0).getDate();
    }

    function esFinDeSemana(anio, mes, dia) {
      var dow = new Date(anio, mes, dia).getDay();
      return dow === 0 || dow === 6;
    }

    function renderTablaValidacion() {
      var anio      = parseInt(document.getElementById('val-anio').value);
      var mes       = parseInt(document.getElementById('val-mes').value);
      var totalDias = getDiasEnMes(anio, mes);

      var html = '<table class="table-validacion"><thead><tr><th>Usuario / Día</th>';
      for (var d = totalDias; d >= 1; d--) {
        html += '<th class="' + (esFinDeSemana(anio, mes, d) ? 'weekend' : '') + '">' + d + '</th>';
      }
      html += '</tr></thead><tbody>';

      var cantDiaria = {};

      Object.keys(datosValidacion).forEach(function(nombre) {
        html += '<tr><td>' + nombre + '</td>';
        for (var d = totalDias; d >= 1; d--) {
          var val = datosValidacion[nombre][d] || 0;
          cantDiaria[d] = (cantDiaria[d] || 0) + val;
          html += '<td class="' + (esFinDeSemana(anio, mes, d) ? 'weekend' : '') + '">' + val + '</td>';
        }
        html += '</tr>';
      });

      html += '</tbody><tfoot><tr><td>Cant Diaria</td>';
      for (var d = totalDias; d >= 1; d--) {
        html += '<td class="' + (esFinDeSemana(anio, mes, d) ? 'weekend' : '') + '">' + (cantDiaria[d] || 0) + '</td>';
      }
      html += '</tr></tfoot></table>';

      document.getElementById('tabla-validacion-container').innerHTML = html;
    }
  </script>
</body>
</html>
