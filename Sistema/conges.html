<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Congelaciones - Susana Vighi</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link rel="shortcut icon" type="image/png" href="IMG/favicon.png">
  <link rel="stylesheet" href="CSS/bootstrap.css" type="text/css">
  <link rel="stylesheet" href="CSS/animate.min.css" type="text/css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="CSS/style.css?v=7" type="text/css">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300|Open+Sans:400,600,700&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-2.1.0.min.js" crossorigin="anonymous"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js" integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa" crossorigin="anonymous"></script>
</head>

<script>
  $(document).ready(function () {
    $("#navbar").load("navbar.html");
    $("#side-navbar").load("side-navbar.html");
    $("#footer").load("footer.html");
  });
</script>

<body>
  <div id="navbar"></div>
  <div id="side-navbar"></div>

  <div class="wrapper">
    <div class="ibox ibox-shadow usuarios-page">

      <div class="ibox-title">
        <hr class="mb-1 mt-0">
        <h3 class="page-title"><i class="fas fa-snowflake"></i> Congelaciones</h3>
        <hr class="mb-0 mt-1">
      </div>

      <div class="ibox-content estudios-content">

        <!-- Tabs -->
        <ul class="nav nav-tabs estudios-tabs">
          <li class="active"><a href="#tab-tablero"        data-toggle="tab"><i class="fas fa-table"></i> Tablero</a></li>
          <li><a href="#tab-agenda"         data-toggle="tab"><i class="fas fa-calendar-alt"></i> Agenda</a></li>
          <li><a href="#tab-dashboard"      data-toggle="tab"><i class="fas fa-chart-bar"></i> Dashboard</a></li>
          <li><a href="#tab-agenda-patologo" data-toggle="tab"><i class="fas fa-user-md"></i> Agenda patólogo</a></li>
        </ul>

        <!-- Filtros compartidos -->
        <div class="estudios-filtros-wrapper">

          <!-- Fila 1: usuario / patólogo -->
          <div class="estudios-filtros-fila">
            <div class="conges-filtro-grupo">
              <label>Usuario asignado</label>
              <select class="form-control estudios-sel conges-sel-lg"><option>[ Todos ]</option></select>
            </div>
            <div class="conges-filtro-grupo">
              <label>Patólogo Congelación</label>
              <select class="form-control estudios-sel conges-sel-lg"><option>[ Todos ]</option></select>
            </div>
          </div>

          <!-- Fila 2: actividad / flujo / tipo biopsia / procedencia / cobertura / médico -->
          <div class="estudios-filtros-fila">
            <div class="conges-filtro-grupo">
              <label>Actividad</label>
              <select class="form-control estudios-sel estudios-sel-lg"><option>[ Todas ]</option></select>
            </div>
            <div class="conges-filtro-grupo">
              <label>Flujo</label>
              <select class="form-control estudios-sel estudios-sel-lg"><option>[ Todos ]</option></select>
            </div>
            <div class="conges-filtro-grupo">
              <label>Tipo Biopsia</label>
              <select class="form-control estudios-sel estudios-sel-md"><option>[ Todas ]</option></select>
            </div>
            <div class="conges-filtro-grupo">
              <label>Procedencia</label>
              <select class="form-control estudios-sel estudios-sel-md"><option>[ Todas ]</option></select>
            </div>
            <div class="conges-filtro-grupo">
              <label>Cobertura</label>
              <select class="form-control estudios-sel estudios-sel-xl"><option>[ Todas ]</option></select>
            </div>
            <div class="conges-filtro-grupo">
              <label>Médico</label>
              <select class="form-control estudios-sel estudios-sel-xl"><option>[ Todos ]</option></select>
            </div>
          </div>

        </div>

        <!-- Tab content -->
        <div class="tab-content estudios-tab-content">

          <!-- TABLERO -->
          <div class="tab-pane active" id="tab-tablero">
            <div class="table-responsive">
              <table class="table estudios-tabla conges-tabla">
                <thead>
                  <tr>
                    <th>Actividad</th>
                    <th># Protocolo</th>
                    <th>Procedencia</th>
                    <th>Cobertura</th>
                    <th>PC</th>
                    <th>MF</th>
                    <th>Médico</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="tbodyConges">
                  <tr>
                    <td colspan="8" class="text-center estudios-vacio">
                      <i class="fas fa-snowflake estudios-vacio-icono"></i>
                      <p>No hay congelaciones registradas.</p>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- AGENDA -->
          <div class="tab-pane" id="tab-agenda">

            <!-- Filtros agenda fila 1 -->
            <div class="agenda-filtros-fila">
              <select class="form-control estudios-sel estudios-sel-md"><option>[ Procedencia: todas ]</option></select>
              <select class="form-control estudios-sel estudios-sel-lg"><option>[ Patólogo: todos ]</option></select>
              <select class="form-control estudios-sel estudios-sel-lg"><option>[ Médico tratante: todos ]</option></select>
              <select class="form-control estudios-sel estudios-sel-md"><option>[ Vinculadas: todas ]</option></select>
              <div class="agenda-tags-btns">
                <button class="btn btn-agenda-tag" id="btnTagGI">GI</button>
                <button class="btn btn-agenda-tag" id="btnTagQR">QR</button>
                <button class="btn btn-agenda-tag" id="btnTagPUN">PUN</button>
              </div>
            </div>

            <!-- Filtros agenda fila 2 -->
            <div class="agenda-filtros-fila">
              <select class="form-control estudios-sel estudios-sel-anio" id="agendaAnio">
                <option>2024</option><option>2025</option><option selected>2026</option>
              </select>
              <select class="form-control estudios-sel estudios-sel-mes" id="agendaMes">
                <option>Enero</option><option>Febrero</option><option>Marzo</option>
                <option>Abril</option><option selected>Mayo</option><option>Junio</option>
                <option>Julio</option><option>Agosto</option><option>Septiembre</option>
                <option>Octubre</option><option>Noviembre</option><option>Diciembre</option>
              </select>
              <div class="agenda-semanas" id="agendaSemanas">
                <!-- generado por JS -->
              </div>
              <button class="btn btn-agenda-horario"><i class="far fa-clock"></i> En horario</button>
              <button class="btn btn-agenda-horario"><i class="far fa-clock"></i> Fuera de horario</button>
              <button class="btn btn-agenda-descargar"><i class="fas fa-download"></i> Descargar</button>
            </div>

            <!-- Grilla semanal -->
            <div class="agenda-grilla-wrapper">
              <div class="agenda-grilla" id="agendaGrilla">
                <!-- generado por JS -->
              </div>
            </div>

          </div>

          <!-- DASHBOARD -->
          <div class="tab-pane" id="tab-dashboard">

            <!-- Filtros dashboard -->
            <div class="dash-filtros-fila">
              <div class="dash-filtro-grupo">
                <label class="dash-label">Año</label>
                <select class="form-control estudios-sel dash-sel-anio" id="dashAnio">
                  <option>2024</option><option>2025</option><option selected>2026</option>
                </select>
              </div>
              <div class="dash-filtro-grupo">
                <label class="dash-label">Procedencia</label>
                <select class="form-control estudios-sel dash-sel-md" id="dashProcedencia">
                  <option>[ Todas ]</option>
                </select>
              </div>
              <div class="dash-filtro-grupo">
                <label class="dash-label">Patólogo</label>
                <select class="form-control estudios-sel dash-sel-md" id="dashPatologo">
                  <option>[ Todos ]</option>
                </select>
              </div>
              <div class="dash-filtro-grupo">
                <label class="dash-label">Médico tratante</label>
                <select class="form-control estudios-sel dash-sel-lg" id="dashMedico">
                  <option>[ Todos ]</option>
                </select>
              </div>
              <div class="dash-filtro-grupo">
                <label class="dash-label">Tipo</label>
                <div class="dash-toggle-group">
                  <button class="btn btn-dash-toggle" data-grupo="tipo" data-valor="GI">GI</button>
                  <button class="btn btn-dash-toggle" data-grupo="tipo" data-valor="QR">QR</button>
                  <button class="btn btn-dash-toggle" data-grupo="tipo" data-valor="PUN">PUN</button>
                </div>
              </div>
              <div class="dash-filtro-grupo">
                <label class="dash-label">Horario</label>
                <div class="dash-toggle-group">
                  <button class="btn btn-dash-toggle" data-grupo="horario" data-valor="en">
                    <i class="far fa-clock"></i> En
                  </button>
                  <button class="btn btn-dash-toggle" data-grupo="horario" data-valor="fuera">
                    <i class="far fa-clock"></i> Fuera
                  </button>
                </div>
              </div>
              <div class="dash-filtro-grupo">
                <label class="dash-label">Detalle</label>
                <button class="btn btn-dash-descargar">
                  <i class="fas fa-download"></i> Descargar
                </button>
              </div>
            </div>

            <!-- Tabla patólogos x meses -->
            <div class="table-responsive">
              <table class="table dash-tabla">
                <thead>
                  <tr>
                    <th></th>
                    <th>Enero</th><th>Febrero</th><th>Marzo</th><th>Abril</th>
                    <th>Mayo</th><th>Junio</th><th>Julio</th><th>Agosto</th>
                    <th>Septiembre</th><th>Octubre</th><th>Noviembre</th><th>Diciembre</th>
                    <th class="dash-th-total">Total</th>
                  </tr>
                </thead>
                <tbody id="tbodyDashboard"></tbody>
                <tfoot id="tfootDashboard"></tfoot>
              </table>
            </div>

          </div>

          <!-- AGENDA PATÓLOGO -->
          <div class="tab-pane" id="tab-agenda-patologo">

            <!-- Médico congelación -->
            <div class="ap-seccion">
              <label class="ap-label">Médico congelación</label>
              <select class="form-control ap-sel-patologo" id="apPatologo">
                <option value="">[ Seleccionar patólogo ]</option>
              </select>
            </div>

            <!-- Estado -->
            <div class="ap-seccion">
              <label class="ap-label">Estado</label>
              <div class="ap-toggle-group" id="apEstadoGroup"></div>
            </div>

            <!-- Procedencia -->
            <div class="ap-seccion">
              <label class="ap-label">Procedencia</label>
              <div class="ap-toggle-group" id="apProcedenciaGroup"></div>
            </div>

            <!-- Cards -->
            <div class="ap-cards" id="apCards">
              <div class="text-center estudios-vacio" style="padding:30px 0">
                <i class="fas fa-user-md estudios-vacio-icono"></i>
                <p>Seleccioná un patólogo para ver su agenda.</p>
              </div>
            </div>

          </div>

        </div>

      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="JS/conges.js"></script>
</body>
</html>
