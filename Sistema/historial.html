<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial �?? Susana Vighi</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link rel="shortcut icon" type="image/png" href="IMG/favicon.png">
  <link rel="stylesheet" href="CSS/bootstrap-minimal.css" type="text/css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="CSS/style.css?v=10" type="text/css">
  <link rel="stylesheet" href="CSS/vighi-design-system.css" type="text/css">
  <link rel="stylesheet" href="CSS/pages/historial.css" type="text/css">
  <script src="https://code.jquery.com/jquery-2.1.0.min.js" crossorigin="anonymous"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js" crossorigin="anonymous"></script>
</head>

<script>
  $(document).ready(function () {
    $("#navbar").load("navbar.html?v=3");
    $("#side-navbar").load("side-navbar.html?v=7");
  });
</script>

<body>
  <div id="navbar"></div>
  <div id="side-navbar"></div>

  <div class="wrapper">
  <div class="his-page">

    <!-- Header -->
    <div class="his-header">
      <span class="his-eyebrow">Actividad reciente</span>
      <span class="his-sep"></span>
      <h1 class="his-title"><i class="fa fa-clock-rotate-left"></i> Historial</h1>
    </div>

    <!-- Protocolos -->
    <div class="his-card">
      <div class="his-card-head">
        <i class="fas fa-file-alt his-card-icon"></i>
        <span class="his-card-label">Protocolos</span>
      </div>
      <div class="his-tabla-wrap">
        <table class="his-tabla">
          <thead>
            <tr>
              <th># Protocolo</th>
              <th>Recolección</th>
              <th>Paciente</th>
              <th>Médico</th>
              <th>Procedencia</th>
              <th>Tipo</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="hisProcTbody"></tbody>
        </table>
      </div>
    </div>

    <!-- Médicos + Pacientes -->
    <div class="his-cols">

      <div class="his-card">
        <div class="his-card-head">
          <i class="fas fa-user-md his-card-icon"></i>
          <span class="his-card-label">Médicos</span>
        </div>
        <table class="his-tabla">
          <thead><tr><th>Nombre</th></tr></thead>
          <tbody id="hisMedTbody"></tbody>
        </table>
      </div>

      <div class="his-card">
        <div class="his-card-head">
          <i class="fas fa-id-card his-card-icon"></i>
          <span class="his-card-label">Pacientes</span>
        </div>
        <table class="his-tabla">
          <thead><tr><th>Nombre</th></tr></thead>
          <tbody id="hisPacTbody"></tbody>
        </table>
      </div>

    </div>

  </div>
  </div>

  <script src="JS/historial-utils.js"></script>
  <script src="JS/historial.js"></script>
</body>
</html>
