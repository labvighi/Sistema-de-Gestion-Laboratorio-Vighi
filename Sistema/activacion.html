<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activación - Susana Vighi</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link rel="shortcut icon" type="image/png" href="IMG/favicon.png">
  <link rel="stylesheet" href="CSS/bootstrap.css" type="text/css">
  <link rel="stylesheet" href="CSS/animate.min.css" type="text/css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="CSS/style.css?v=8" type="text/css">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300|Open+Sans:400,600,700&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-2.1.0.min.js" crossorigin="anonymous"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js" integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa" crossorigin="anonymous"></script>
</head>

<script>
  $(document).ready(function () {
    $("#navbar").load("navbar.html");
    $("#side-navbar").load("side-navbar.html");
    $("#footer").load("footer.html");
  });
</script>

<body>
  <div id="navbar"></div>
  <div id="side-navbar"></div>

  <div class="wrapper">
    <div class="ibox ibox-shadow estudios-page">

      <div class="ibox-title">
        <h3 class="page-title"><i class="fas fa-user-check"></i> Activación</h3>
        <p class="etiq-subtitulo">Activación de protocolos para poder avanzar al laboratorio.</p>
        <hr class="mb-0 mt-1">
      </div>

      <div class="ibox-content estudios-content">

        <!-- Tabs PAP / BP -->
        <ul class="nav nav-tabs estudios-tabs" id="activTabs">
          <li class="active"><a href="#act-pap" data-toggle="tab">PAP</a></li>
          <li><a href="#act-bp"  data-toggle="tab">BP</a></li>
        </ul>

        <div class="tab-content">
          <div class="tab-pane active" id="act-pap">

            <!-- Filtros fila 1 -->
            <div class="estudios-filtros-fila act-filtros-fila">
              <select class="form-control estudios-sel estudios-sel-sm" id="actSubtipo">
                <option>PAPS</option>
                <option>CT</option>
              </select>
              <select class="form-control estudios-sel estudios-sel-xl" id="actCitotecnico">
                <option value="">[ Citotécnico: todos ]</option>
              </select>
              <select class="form-control estudios-sel estudios-sel-md" id="actLote">
                <option value="">[ Lote: todos ]</option>
              </select>
            </div>

            <!-- Filtros fila 2 -->
            <div class="estudios-filtros-fila act-filtros-fila">
              <select class="form-control estudios-sel estudios-sel-lg" id="actProcedencia">
                <option value="">[ Procedencia: todas ]</option>
              </select>
            </div>

            <!-- Filtros fila 3 -->
            <div class="estudios-filtros-fila act-filtros-fila">
              <select class="form-control estudios-sel estudios-sel-md" id="actImagen">
                <option value="">[ Imagen: todos ]</option>
                <option value="con">[ Con imagen ]</option>
                <option value="sin">[ Sin imagen ]</option>
              </select>
              <select class="form-control estudios-sel estudios-sel-xl" id="actMedico">
                <option value="">[ Médico: todos ]</option>
              </select>
              <select class="form-control estudios-sel estudios-sel-md" id="actEstudios">
                <option value="">[ Con estudios ]</option>
                <option value="con">[ Con estudios ]</option>
                <option value="sin">[ Sin estudios ]</option>
              </select>
              <select class="form-control estudios-sel estudios-sel-xl" id="actCobertura">
                <option value="">[ Cobertura: todos ]</option>
              </select>
              <select class="form-control estudios-sel estudios-sel-md" id="actPaciente">
                <option value="">[ Con paciente ]</option>
                <option value="con">[ Con paciente ]</option>
                <option value="sin">[ Sin paciente ]</option>
              </select>
            </div>

            <!-- Contador -->
            <div class="act-contador" id="actContador"></div>

            <!-- Tabla -->
            <div class="act-tabla-wrap">
              <table class="table act-tabla" id="actTabla">
                <thead>
                  <tr>
                    <th>FR</th>
                    <th>#Protocolo</th>
                    <th>Tipo</th>
                    <th>Lote</th>
                    <th>Procedencia</th>
                    <th>Estado</th>
                    <th>Médico</th>
                    <th>#E</th>
                    <th>Cobertura</th>
                    <th>Paciente</th>
                    <th class="act-th-centro"><i class="fas fa-eye"></i></th>
                    <th class="act-th-centro"><i class="fas fa-image"></i></th>
                    <th class="act-th-centro">AUTH</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="actTbody">
                  <tr>
                    <td colspan="12" class="act-vacio">
                      <i class="fas fa-info-circle"></i> No hay protocolos para los filtros seleccionados.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

          </div><!-- /tab-pane pap -->

          <div class="tab-pane" id="act-bp">
            <div class="flujos-info-vacio mt-3">
              <i class="fas fa-info-circle"></i> No hay protocolos BP pendientes de activación.
            </div>
          </div>
        </div><!-- /tab-content -->

      </div>
    </div>
  </div>

  <div id="footer"></div>
  <script src="JS/activacion.js"></script>
</body>
</html>
