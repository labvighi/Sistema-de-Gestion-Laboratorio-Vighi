<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Ticket — Susana Vighi</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link rel="shortcut icon" type="image/png" href="IMG/favicon.png">
  <link rel="stylesheet" href="CSS/bootstrap-minimal.css" type="text/css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="CSS/style.css?v=10" type="text/css">
  <link rel="stylesheet" href="CSS/vighi-design-system.css" type="text/css">
  <script src="https://code.jquery.com/jquery-2.1.0.min.js" crossorigin="anonymous"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="CSS/pages/nuevoTicket.css" type="text/css">
</head>

<script>
  $(document).ready(function () {
    $("#navbar").load("navbar.html?v=3");
    $("#side-navbar").load("side-navbar.html?v=7");
    $("#footer").load("footer.html?v=2");
  });
</script>

<body>
  <div id="navbar"></div>
  <div id="side-navbar"></div>

  <div class="wrapper">
  <div class="nt-page">

    <!-- Breadcrumb -->
    <div class="nueva-conge-breadcrumb">
      <a href="soporte.html"><i class="fas fa-life-ring"></i> Soporte</a>
      <span class="nc-sep">/</span>
      <span>Nuevo ticket de soporte</span>
    </div>

    <!-- Title -->
    <h1 class="nt-title"><i class="fas fa-plus-circle"></i> Nuevo ticket de soporte</h1>

    <!-- Card -->
    <div class="nt-card">
      <div class="nueva-conge-content">

        <div class="nt-layout">

          <!-- Columna principal -->
          <div class="nt-col-main">

            <div class="nt-campo">
              <label class="nt-label">Asunto</label>
              <input type="text" class="form-control nt-input-asunto" id="ntAsunto" placeholder="" autofocus>
            </div>

            <div class="nt-campo">
              <label class="nt-label">Descripción</label>
              <textarea class="form-control nt-textarea" id="ntDescripcion" rows="5"></textarea>
            </div>

            <div class="nt-campo">
              <label class="nt-label">Urgencia</label>
              <div class="nt-check-fila">
                <input type="checkbox" id="chkProtocolo">
                <label for="chkProtocolo" class="nt-check-label">
                  Impide la entrega del informe de uno o más protocolos
                </label>
              </div>
              <div class="nt-check-fila">
                <input type="checkbox" id="chkFactura">
                <label for="chkFactura" class="nt-check-label">
                  Impide la entrega de una o más facturas que deben ser entregadas hoy
                </label>
              </div>
            </div>

            <div class="nt-campo">
              <label class="nt-label">Responsable asignado</label>
              <div class="nt-responsable-fila">
                <select class="form-control nt-sel-area" id="ntArea">
                  <option>Gerencial</option>
                  <option>Técnico</option>
                  <option>Administración</option>
                </select>
                <select class="form-control nt-sel-usuario" id="ntUsuario">
                  <option>BACA, Tiago</option>
                </select>
                <div class="nt-check-fila nt-check-inline">
                  <input type="checkbox" id="chkNotificar" checked>
                  <label for="chkNotificar" class="nt-check-label">
                    Notificar por e-mail al responsable
                  </label>
                </div>
              </div>
            </div>

            <div class="nt-footer-bar">
              <button class="btn btn-nt-ia" id="btnAnalizarIA">
                <i class="fas fa-robot"></i> Analizar con IA
              </button>
              <button class="btn btn-nt-crear" id="btnCrearTicket">
                <i class="fas fa-paper-plane"></i> Crear ticket
              </button>
            </div>

          </div><!-- /col-main -->

          <!-- Columna sidebar -->
          <div class="nt-col-sidebar">

            <div class="nt-campo">
              <label class="nt-label">Tipo</label>
              <div class="nt-toggle-group" id="ntTipoGroup">
                <button class="btn btn-nt-toggle active" data-valor="Resolutivo">
                  <i class="fas fa-wrench"></i> Resolutivo
                </button>
                <button class="btn btn-nt-toggle" data-valor="Evolutivo">
                  <i class="fas fa-rocket"></i> Evolutivo
                </button>
              </div>
            </div>

            <hr class="nt-sidebar-sep">

            <div class="nt-campo">
              <label class="nt-label">Urgencia</label>
              <div class="nt-toggle-group" id="ntUrgenciaGroup">
                <button class="btn btn-nt-toggle active" data-valor="Regular">
                  <i class="far fa-clock"></i> Regular
                </button>
                <button class="btn btn-nt-toggle btn-nt-toggle-urgente" data-valor="Urgente">
                  <i class="fas fa-fire"></i> Urgente
                </button>
              </div>
            </div>

            <hr class="nt-sidebar-sep">

            <div class="nt-campo">
              <label class="nt-label">Prioridad</label>
              <div class="nt-toggle-group" id="ntPrioridadGroup">
                <button class="btn btn-nt-toggle active" data-valor="Baja">
                  <i class="fas fa-person-walking"></i> Baja
                </button>
                <button class="btn btn-nt-toggle" data-valor="Media">
                  <i class="fas fa-person-running"></i> Media
                </button>
                <button class="btn btn-nt-toggle btn-nt-toggle-alta" data-valor="Alta">
                  <i class="fas fa-bolt"></i> Alta
                </button>
              </div>
            </div>

          </div><!-- /col-sidebar -->

        </div><!-- /nt-layout -->

        <!-- Captura de pantalla -->
        <div class="nt-captura-seccion">
          <div class="nt-captura-hints">
            <div><i class="fas fa-camera"></i> <strong>Captura de pantalla (opcional)</strong></div>
            <div><i class="fas fa-desktop"></i> Capturar con tecla Imprimir Pantalla</div>
            <div><i class="fas fa-paste"></i> Pegar con CTRL + V</div>
          </div>
          <div class="nt-captura-drop" id="ntCapturaArea">
            <span id="ntCapturaPlaceholder" class="nt-captura-placeholder">
              <i class="fas fa-image"></i> La captura pegada aparecerá aquí
            </span>
            <img id="ntCapturaImg" class="hidden" alt="Captura">
            <button class="btn btn-nt-borrar-img hidden" id="btnBorrarCaptura">
              <i class="fas fa-times"></i> Quitar
            </button>
          </div>
        </div>

      </div>
    </div>

  </div>
  </div>

  <div id="footer"></div>
  <script src="JS/nuevoTicket.js"></script>
</body>
</html>
