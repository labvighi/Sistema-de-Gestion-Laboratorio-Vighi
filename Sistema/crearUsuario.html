<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Susana Vighi - Sistema de Gestión Integral</title>
    <link rel="shortcut icon" href="IMG/favicon.png">
    <link rel="stylesheet" href="CSS/bootstrap.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="CSS/animate.min.css">
    <link rel="stylesheet" href="CSS/inspinia.css">
    <link rel="stylesheet" href="CSS/navbar.css">
    <link rel="stylesheet" href="CSS/style_mobile.css">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-2.1.1.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</head>
<body class="pace-done">

    <div id="navbar"></div>

    <div id="wrapper">
        <div id="side-navbar"></div>

        <div id="page-wrapper">
            <div class="wrapper wrapper-content">

                <div class="ibox">
                    <div class="ibox-title">
                        <h5>Nuevo usuario</h5>
                    </div>
                    <div class="ibox-content">

                        <div id="status"></div>

                        <form id="formRegistro">
                            <div class="row">
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label>Nombre</label>
                                        <input type="text" id="nombre" class="form-control" placeholder="Nombre..." required>
                                        <span id="errorNombre" class="label label-danger" style="display:none;">Requerido</span>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label>Apellido</label>
                                        <input type="text" id="apellido" class="form-control" placeholder="Apellido..." required>
                                        <span id="errorApellido" class="label label-danger" style="display:none;">Requerido</span>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label>Dirección</label>
                                        <select id="direccion" class="form-control">
                                            <option value="1">Av. Santa Fe</option>
                                            <option value="2">CM Monserrat</option>
                                            <option value="3">CM Otamendi</option>
                                            <option value="4">Medrano</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label>Teléfono</label>
                                        <input type="text" id="telefono" class="form-control" placeholder="Teléfono..." required>
                                        <span id="errorTelefono" class="label label-danger" style="display:none;">Requerido</span>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label>E-mail</label>
                                        <input type="email" id="email" class="form-control" placeholder="E-mail..." required>
                                        <span id="errorEmail" class="label label-danger" style="display:none;">E-mail inválido</span>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label>Perfil</label>
                                        <select id="perfil" class="form-control">
                                            <option value="1">Administración</option>
                                            <option value="2">Citotécnico</option>
                                            <option value="3">Dirección</option>
                                            <option value="4">Externo</option>
                                            <option value="5">Gerencial</option>
                                            <option value="6">Patólogo</option>
                                            <option value="7">Técnico</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label>Contraseña</label>
                                        <input type="password" id="clave" class="form-control" placeholder="Contraseña..." required minlength="6">
                                        <span id="errorClave" class="label label-danger" style="display:none;">Mínimo 6 caracteres</span>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label>Confirmar Contraseña</label>
                                        <input type="password" id="confirmarClave" class="form-control" placeholder="Confirmar contraseña..." required>
                                        <span id="errorConfirmar" class="label label-danger" style="display:none;">Las contraseñas no coinciden</span>
                                    </div>
                                </div>
                            </div>

                            <hr>
                            <div>
                                <a href="prueba.html" class="btn btn-white">Cancelar</a>
                                <button type="submit" id="btnCrear" class="btn btn-primary"><i class="fa fa-plus-circle"></i> Crear usuario</button>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
            <div id="footer"></div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $("#navbar").load("navbar.html");
            $("#side-navbar").load("side-navbar.html");
            $("#footer").load("footer.html");
        });
    </script>
    <script src="JS/registro.js"></script>
</body>
</html>
