<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacientes — Susana Vighi</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link rel="shortcut icon" type="image/png" href="IMG/favicon.png">
  <link rel="stylesheet" href="CSS/bootstrap-minimal.css" type="text/css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="CSS/style.css?v=10" type="text/css">
  <link rel="stylesheet" href="CSS/vighi-design-system.css" type="text/css">
  <link rel="stylesheet" href="CSS/pages/pacientes.css" type="text/css">
  <script src="https://code.jquery.com/jquery-2.1.0.min.js" crossorigin="anonymous"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js" crossorigin="anonymous"></script>
</head>

<script>
  $(document).ready(function () {
    $("#navbar").load("navbar.html?v=3");
    $("#side-navbar").load("side-navbar.html?v=7");
    $("#footer").load("footer.html?v=2");
  });
</script>

<body>
  <div id="navbar"></div>
  <div id="side-navbar"></div>

  <div class="wrapper">
  <div class="pac-page">

    <!-- Header -->
    <div class="pac-header">
      <div>
        <div class="pac-eyebrow">Agenda</div>
        <h1 class="pac-title"><i class="fas fa-id-card"></i> Pacientes</h1>
      </div>
      <button class="pac-btn"><i class="fas fa-plus"></i> Nuevo paciente</button>
    </div>

    <!-- B�squeda -->
    <div class="pac-search-card">

      <!-- Por apellido/nombre -->
      <div class="pac-search-block">
        <div class="pac-field">
          <label class="pac-label">Apellido</label>
          <select id="modoApellido" class="pac-select" style="width:130px;">
            <option value="empieza">Empieza con</option>
            <option value="contiene">Contiene</option>
            <option value="exacto">Exacto</option>
          </select>
        </div>
        <div class="pac-field">
          <label class="pac-label">&nbsp;</label>
          <input type="text" id="inputApellido" class="pac-input" placeholder="Apellido..." style="width:160px;" autocomplete="off">
        </div>
        <div class="pac-field">
          <label class="pac-label">Nombre <span class="pac-label-opt">(opcional)</span></label>
          <input type="text" id="inputNombre" class="pac-input" placeholder="Nombre..." style="width:140px;" autocomplete="off">
        </div>
        <button id="btnBuscarApellido" class="pac-search-btn">
          <i class="fa fa-search"></i> Buscar
        </button>
      </div>

      <!-- Separador -->
      <div class="pac-search-sep"></div>

      <!-- Por DNI -->
      <div class="pac-search-block" style="flex: 0 0 auto;">
        <div class="pac-field">
          <label class="pac-label">Por DNI</label>
          <input type="text" id="inputDni" class="pac-input" placeholder="Ej: 30123456" style="width:150px;" autocomplete="off">
        </div>
        <button id="btnBuscarDni" class="pac-search-btn">
          <i class="fa fa-search"></i> Buscar
        </button>
      </div>

    </div><!-- /search-card -->

    <!-- Resultados -->
    <div class="pac-results-card">
      <div id="pacientes-resultados">
        <div class="pacientes-vacio">
          <i class="fas fa-id-card pacientes-vacio-icono"></i>
          <p>Ingresá un apellido o DNI para buscar pacientes.</p>
        </div>
      </div>
    </div>

  </div>
  </div>

  <div id="footer"></div>
  <script src="JS/historial-utils.js"></script>
  <script src="JS/pacientes.js"></script>
</body>
</html>
